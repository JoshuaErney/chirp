<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐦 Chirp — Toast Notification Demo</title>
    <link rel="stylesheet" href="chirp.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🐦 Chirp</h1>
        <p>Lightweight, dependency-free toast notifications</p>
        <button class="clear-all" onclick="clearAll()">Clear all</button>
    </header>

    <div class="grid">

        <!-- Types -->
        <div class="card">
            <h2>Types</h2>
            <div class="btn-group">
                <button class="success" onclick="showSuccess()">Success</button>
                <button class="error" onclick="showError()">Error</button>
                <button class="warning" onclick="showWarning()">Warning</button>
                <button class="info" onclick="showInfo()">Info</button>
                <button onclick="showDefault()">Default</button>
            </div>
        </div>

        <!-- Themes -->
        <div class="card">
            <h2>Themes</h2>
            <div class="btn-group">
                <button onclick="showGlass()">Glass</button>
                <button onclick="showBrutalist()">Brutalist</button>
                <button onclick="showGlassSuccess()">Glass + Success</button>
                <button onclick="showBrutalistWarning()">Brutalist + Warning</button>
            </div>
        </div>

        <!-- Positions -->
        <div class="card">
            <h2>Positions</h2>
            <div class="location-grid">
                <button onclick="showPosition('top-left')">Top Left</button>
                <button onclick="showPosition('top-center')">Top Center</button>
                <button onclick="showPosition('top-right')">Top Right</button>
                <button onclick="showPosition('bottom-left')">Bottom Left</button>
                <button onclick="showPosition('bottom-center')">Bottom Center</button>
                <button onclick="showPosition('bottom-right')">Bottom Right</button>
            </div>
        </div>

        <!-- Buttons -->
        <div class="card">
            <h2>With Buttons</h2>
            <div class="btn-group">
                <button onclick="showConfirmDelete()">Confirm Delete</button>
                <button onclick="showUpdatePrompt()">Update Prompt</button>
            </div>
        </div>

        <!-- Promise -->
        <div class="card">
            <h2>Promise</h2>
            <div class="btn-group">
                <button onclick="showPromiseResolve()">Resolve</button>
                <button onclick="showPromiseReject()">Reject</button>
            </div>
        </div>

        <!-- Custom -->
        <div class="card">
            <h2>Custom</h2>
            <div class="btn-group">
                <button onclick="showCustomIcon()">Custom Icon</button>
                <button onclick="showCustomHTML()">Custom HTML</button>
                <button onclick="showOnClick()">onClick</button>
            </div>
        </div>

    </div>

    <footer>
        <p>🐦 Chirp — forked from <a href="https://github.com/nlanger/butterup" target="_blank">Butterup</a> · MIT License</p>
    </footer>

    <script src="chirp.js"></script>
    <script src="demo.js"></script>
</body>

</html>
